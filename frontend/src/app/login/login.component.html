<div class="d-flex justify-content-center">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h3>Login</h3>
    <div>
      <label class="form-label" for="username">Usuário</label>
      <input id="username" class="form-control" formControlName="username" autocomplete="username">
    </div>
    <div>
      <label class="form-label" for="password">Senha</label>
      <input id="password" class="form-control" formControlName="password" type="password" autocomplete="current-password">
    </div>
    @if (erro()) {
      <p class="error-message" role="alert">{{ erro() }}</p>
    }
    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Entrando...' : 'Entrar' }}</button>
  </form>
</div>
